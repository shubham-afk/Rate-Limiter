services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gatekeeper
      POSTGRES_USER: gatekeeper
      POSTGRES_PASSWORD: gatekeeper
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gatekeeper -d gatekeeper"]
      interval: 5s
      timeout: 3s
      retries: 10
  migrate:
    build: ./backend
    command: python manage.py migrate
    environment: &backend_env
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgres://gatekeeper:gatekeeper@postgres:5432/gatekeeper
      DJANGO_DEBUG: "true"
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:-local-development-admin-token}
    volumes: [./backend:/app]
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
  backend_1: &backend
    build: ./backend
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000
    environment: *backend_env
    volumes: [./backend:/app]
    depends_on:
      migrate:
        condition: service_completed_successfully
  backend_2:
    <<: *backend
  event_worker:
    <<: *backend
    command: python manage.py consume_request_events
  nginx:
    image: nginx:1.27-alpine
    volumes: [./nginx/nginx.conf:/etc/nginx/nginx.conf:ro]
    ports: ["8000:80"]
    depends_on: [backend_1, backend_2]
volumes:
  postgres_data:
